<!doctype html>
<html>

<head>
    <title>TEST</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #fff;
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1rem;
        }

        .container {
            position: absolute;
            inset: 0;
            display: flex;
            background: #fff;
        }

        #gutters {
            min-width: 45px;
            padding: 12px 6px;
            background: #fdfdfd;
            border-right: 1px solid #eaeaea;
            color: #aaa;
            text-align: right;
            user-select: none;
            overflow: hidden;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre;
        }

        #paste {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            border: none;
            outline: none;
            background: #fff;
            color: #000;
            padding: 12px;
            padding-bottom: 40px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.5;
        }

        #paste:empty::before {
            content: attr(data-placeholder);
            color: #999;
            pointer-events: none;
        }

        #paste img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            border: 1px solid #ccc;
            vertical-align: middle;
            cursor: default;
        }

        #paste img.img-selected {
            outline: 2px solid #0078d4;
            outline-offset: 1px;
        }

        .resize-handle {
            position: fixed;
            background: #0078d4;
            border: 1px solid #fff;
            box-sizing: border-box;
            z-index: 10;
            touch-action: none;
            display: none;
        }

        .resize-handle.corner {
            width: 12px;
            height: 12px;
            cursor: se-resize;
        }

        .resize-handle.edge-right {
            width: 8px;
            height: 28px;
            border-radius: 2px;
            cursor: e-resize;
        }

        .resize-handle.edge-bottom {
            width: 28px;
            height: 8px;
            border-radius: 2px;
            cursor: s-resize;
        }

        .bar {
            position: fixed;
            right: 12px;
            bottom: 6px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        button {
            padding: 4px 8px;
            border: 1px solid #888;
            background: #f8f8f8;
            color: #000;
            font: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background: #eee;
        }

        #status {
            position: fixed;
            left: 60px;
            bottom: 6px;
            font-size: 0.9rem;
            color: #666;
            z-index: 5;
            pointer-events: none;
        }

        #user-count {
            position: fixed;
            top: 8px;
            right: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            z-index: 5;
            user-select: none;
            pointer-events: none;
        }

        #paste.drag-over {
            background: #f0f4f8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="gutters">1</div>
        <div id="paste" contenteditable="true" spellcheck="false"
            data-placeholder="Paste or type here... (images can be pasted or dropped too)"></div>
    </div>
    <div id="status"></div>
    <div id="user-count">1</div>
    <div class="bar">
        <button id="copy-btn">Copy</button>
    </div>

    <script>
        const area = document.getElementById("paste");
        const gutters = document.getElementById("gutters");
        const statusEl = document.getElementById("status");
        const userCountEl = document.getElementById("user-count");
        const copyBtn = document.getElementById("copy-btn");

        let socket = null;
        let saveTimer = null;
        let statusTimer = null;
        let reconnectTimer = null;
        let pageCaching = false;

        let selectedImg = null;
        let resizeState = null;

        const handles = {
            corner: createHandle("corner", "both"),
            right: createHandle("edge-right", "width"),
            bottom: createHandle("edge-bottom", "height")
        };

        function setStatus(text, duration = 0) {
            clearTimeout(statusTimer);
            statusEl.textContent = text;
            if (duration > 0) {
                statusTimer = setTimeout(() => { statusEl.textContent = ""; }, duration);
            }
        }

        function getLineHeight() {
            return parseFloat(window.getComputedStyle(area).lineHeight) || 24;
        }

        function getCharWidth() {
            const probe = document.createElement("span");
            probe.textContent = "0";
            probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:inherit;";
            area.appendChild(probe);
            const width = probe.getBoundingClientRect().width || 8;
            probe.remove();
            return width;
        }

        function snapImageToLines(img) {
            const lh = getLineHeight();
            const existingHeight = parseFloat(img.style.height);
            const existingWidth = parseFloat(img.style.width);
            const naturalRatio = img.naturalWidth && img.naturalHeight
                ? img.naturalWidth / img.naturalHeight
                : null;

            const baseHeight = existingHeight > 0
                ? existingHeight
                : (img.getBoundingClientRect().height || img.naturalHeight || img.offsetHeight);

            if (!(baseHeight > 0)) return;

            const targetLines = Math.max(1, Math.round(baseHeight / lh));
            const snappedHeight = targetLines * lh;

            img.style.height = `${snappedHeight}px`;

            if (!(existingWidth > 0) && naturalRatio) {
                img.style.width = `${Math.round(snappedHeight * naturalRatio)}px`;
            }
            img.style.objectFit = "contain";
        }

        function getLogicalLineVisualIndices() {
            const lh = getLineHeight();
            const areaRect = area.getBoundingClientRect();
            const style = window.getComputedStyle(area);
            const paddingTop = parseFloat(style.paddingTop) || 12;
            const areaTop = areaRect.top - area.scrollTop + paddingTop;

            const indices = [];

            function addIndex(topPx) {
                const relY = topPx - areaTop;
                const idx = Math.max(0, Math.round(relY / lh));
                indices.push(idx);
            }

            function getCharTop(textNode, offset) {
                const range = document.createRange();
                const len = textNode.nodeValue.length;
                if (len === 0) {
                    range.selectNode(textNode);
                } else if (offset < len) {
                    range.setStart(textNode, offset);
                    range.setEnd(textNode, offset + 1);
                } else {
                    range.setStart(textNode, offset - 1);
                    range.setEnd(textNode, offset);
                }
                const rects = range.getClientRects();
                return rects.length > 0 ? rects[0].top : range.getBoundingClientRect().top;
            }

            function getNodeTop(node) {
                if (node.nodeType === Node.ELEMENT_NODE) {
                    return node.getBoundingClientRect().top;
                }
                return getCharTop(node, 0);
            }

            let atLineStart = true;

            function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.nodeValue;
                    for (let i = 0; i < text.length; i++) {
                        if (atLineStart) {
                            addIndex(getCharTop(node, i));
                            atLineStart = false;
                        }
                        if (text[i] === '\n') {
                            atLineStart = true;
                        }
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    const tag = node.tagName.toLowerCase();

                    if (tag === "br") {
                        if (atLineStart) {
                            addIndex(getNodeTop(node));
                        }
                        atLineStart = true;
                    } else if (tag === "img") {
                        const topPx = getNodeTop(node);
                        const imgHeight = node.getBoundingClientRect().height || parseFloat(node.style.height) || lh;
                        const lineCount = Math.max(1, Math.round(imgHeight / lh));
                        const relY = topPx - areaTop;
                        const baseIdx = Math.max(0, Math.round(relY / lh));

                        for (let i = 0; i < lineCount; i++) {
                            indices.push(baseIdx + i);
                        }
                        atLineStart = true;
                    } else {
                        const isBlock = window.getComputedStyle(node).display !== "inline";
                        if (isBlock) atLineStart = true;

                        for (const child of node.childNodes) {
                            walk(child);
                        }

                        if (isBlock) atLineStart = true;
                    }
                }
            }

            walk(area);

            if (indices.length === 0) {
                indices.push(0);
            }

            return indices;
        }

        function updateGutters() {
            const lh = getLineHeight();

            area.querySelectorAll("img").forEach(img => {
                if (resizeState && img === selectedImg) return;
                snapImageToLines(img);
            });

            const contentHeight = Math.max(lh, area.scrollHeight - 24);
            const totalVisualLines = Math.max(1, Math.round(contentHeight / lh));

            const logicalIndices = getLogicalLineVisualIndices();
            const lineNumbers = new Array(totalVisualLines).fill("");

            logicalIndices.forEach((visualIndex, logicalLineNum) => {
                if (visualIndex < totalVisualLines && !lineNumbers[visualIndex]) {
                    lineNumbers[visualIndex] = String(logicalLineNum + 1);
                }
            });

            gutters.textContent = lineNumbers.join("\n");

            const maxDigits = String(logicalIndices.length).length;
            gutters.style.width = `${Math.max(45, maxDigits * 10 + 16)}px`;
        }

        let guttersRaf = null;
        const guttersObserver = new ResizeObserver(() => {
            if (guttersRaf) return;
            guttersRaf = requestAnimationFrame(() => {
                guttersRaf = null;
                updateGutters();
            });
        });
        guttersObserver.observe(area);

        function sanitizeHtml(html) {
            const template = document.createElement("template");
            template.innerHTML = html;
            sanitizeChildren(template.content);
            return template.innerHTML;
        }

        function sanitizeChildren(node) {
            for (const child of Array.from(node.childNodes)) {
                if (child.nodeType === Node.TEXT_NODE) continue;
                if (child.nodeType !== Node.ELEMENT_NODE) { child.remove(); continue; }

                const tag = child.tagName.toLowerCase();
                if (tag === "img") {
                    const src = child.getAttribute("src") || "";
                    if (!/^\/pastebin-image\//.test(src)) { child.remove(); continue; }

                    const w = child.style.width;
                    const h = child.style.height;

                    for (const attr of Array.from(child.attributes)) {
                        if (attr.name !== "src" && attr.name !== "alt") child.removeAttribute(attr.name);
                    }

                    child.style.cssText = "object-fit:contain;";
                    if (w) child.style.width = w;
                    if (h) child.style.height = h;
                    continue;
                }
                if (tag === "br" || tag === "div") {
                    for (const attr of Array.from(child.attributes)) child.removeAttribute(attr.name);
                    sanitizeChildren(child);
                    continue;
                }
                child.replaceWith(document.createTextNode(child.textContent));
            }
        }

        function connect() {
            setStatus("Connecting...");
            const protocol = location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${protocol}${location.host}/pastebin-ws`);

            socket.onopen = () => setStatus("");
            socket.onmessage = event => {
                const data = JSON.parse(event.data);
                if (data.type === "update" && document.activeElement !== area) {
                    deselectImage();
                    area.innerHTML = sanitizeHtml(data.text || "");
                    updateGutters();
                }
                if (data.type === "saved") {
                    setStatus("Saved", 1200);
                }
                if (data.users !== undefined) {
                    userCountEl.textContent = data.users;
                }
            };
            socket.onclose = () => {
                if (pageCaching) return;
                setStatus("Offline, reconnecting...");
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connect, 2000);
            };
            socket.onerror = () => socket.close();
        }
        connect();

        window.addEventListener("pagehide", event => {
            if (!event.persisted) return;
            pageCaching = true;
            clearTimeout(reconnectTimer);
            if (socket) socket.close();
        });

        window.addEventListener("pageshow", event => {
            if (!event.persisted) return;
            pageCaching = false;
            connect();
        });

        area.addEventListener("input", () => {
            updateGutters();
            setStatus("Syncing...");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(sendHtml, 300);
        });

        function sendHtml() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                setStatus("Saving...");
                socket.send(JSON.stringify({ type: "update", text: sanitizeHtml(area.innerHTML) }));
            }
        }

        copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(area.textContent);
            setStatus("Copied to clipboard", 1200);
        });

        function getEditableRange() {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                if (area.contains(range.commonAncestorContainer)) return range;
            }
            const range = document.createRange();
            range.selectNodeContents(area);
            range.collapse(false);
            return range;
        }

        function insertNodeAtRange(node, range) {
            range.deleteContents();
            range.insertNode(node);
            range.setStartAfter(node);
            range.collapse(true);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function insertImageAtRange(url, range) {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "pasted image";
            img.onload = () => {
                snapImageToLines(img);
                updateGutters();
                area.dispatchEvent(new Event("input"));
            };
            insertNodeAtRange(img, range);
        }

        function createHandle(className, mode) {
            const handle = document.createElement("div");
            handle.className = `resize-handle ${className}`;
            handle.addEventListener("pointerdown", event => startResize(event, mode, handle));
            document.body.appendChild(handle);
            return handle;
        }

        function positionHandles() {
            if (!selectedImg) return;
            const rect = selectedImg.getBoundingClientRect();

            handles.corner.style.left = `${rect.right - 6}px`;
            handles.corner.style.top = `${rect.bottom - 6}px`;

            handles.right.style.left = `${rect.right - 4}px`;
            handles.right.style.top = `${rect.top + rect.height / 2 - 14}px`;

            handles.bottom.style.left = `${rect.left + rect.width / 2 - 14}px`;
            handles.bottom.style.top = `${rect.bottom - 4}px`;
        }

        function selectImage(img) {
            if (selectedImg === img) return;
            deselectImage();
            selectedImg = img;
            selectedImg.classList.add("img-selected");
            positionHandles();
            Object.values(handles).forEach(h => h.style.display = "block");
        }

        function deselectImage() {
            if (!selectedImg) return;
            selectedImg.classList.remove("img-selected");
            selectedImg = null;
            Object.values(handles).forEach(h => h.style.display = "none");
        }

        function startResize(event, mode, handle) {
            if (!selectedImg) return;
            event.preventDefault();
            event.stopPropagation();
            resizeState = {
                mode,
                startX: event.clientX,
                startY: event.clientY,
                startWidth: selectedImg.getBoundingClientRect().width,
                startHeight: selectedImg.getBoundingClientRect().height,
                aspectRatio: selectedImg.naturalWidth / selectedImg.naturalHeight || 1,
                charWidth: getCharWidth()
            };
            handle.setPointerCapture(event.pointerId);
            handle.addEventListener("pointermove", onResizeMove);
            handle.addEventListener("pointerup", endResize);
        }

        function onResizeMove(event) {
            if (!resizeState || !selectedImg) return;
            const lh = getLineHeight();
            const { mode, startX, startY, startWidth, startHeight, aspectRatio, charWidth } = resizeState;

            let newHeight = startHeight;
            let newWidth = startWidth;

            if (mode === "height" || mode === "both") {
                const deltaY = event.clientY - startY;
                const lineCount = Math.max(1, Math.round((startHeight + deltaY) / lh));
                newHeight = lineCount * lh;
            }

            if (mode === "width" || mode === "both") {
                const deltaX = event.clientX - startX;
                if (mode === "width") {
                    const charCount = Math.max(1, Math.round((startWidth + deltaX) / charWidth));
                    newWidth = charCount * charWidth;
                } else {
                    newWidth = Math.round(newHeight * aspectRatio);
                }
            }

            selectedImg.style.height = `${Math.max(lh, newHeight)}px`;
            selectedImg.style.width = `${Math.max(4, newWidth)}px`;
            selectedImg.style.objectFit = "contain";

            positionHandles();
            updateGutters();
        }

        function endResize(event) {
            const handle = event.currentTarget;
            handle.releasePointerCapture(event.pointerId);
            handle.removeEventListener("pointermove", onResizeMove);
            handle.removeEventListener("pointerup", endResize);
            resizeState = null;
            updateGutters();
            area.dispatchEvent(new Event("input"));
        }

        document.addEventListener("click", event => {
            const target = event.target;
            if (target.tagName === "IMG" && area.contains(target)) {
                selectImage(target);
            } else if (!Object.values(handles).includes(target)) {
                deselectImage();
            }
        });

        area.addEventListener("scroll", () => {
            gutters.scrollTop = area.scrollTop;
            positionHandles();
        });
        window.addEventListener("resize", positionHandles);

        const IMAGE_EXTENSION_RE = /\.(png|jpe?g|gif|webp|bmp|avif|svg|heic|heif)$/i;

        function isImageFile(file) {
            return file && (file.type?.startsWith("image/") || IMAGE_EXTENSION_RE.test(file.name || ""));
        }

        async function uploadImage(file, range) {
            setStatus("Uploading image...");
            const formData = new FormData();
            formData.append("image", file, file.name || "pasted-image.png");
            try {
                const response = await fetch("/pastebin-image", { method: "POST", body: formData });
                if (!response.ok) throw new Error("Upload failed");
                const data = await response.json();
                insertImageAtRange(data.url, range);
                setStatus("");
            } catch {
                setStatus("Image upload failed", 2000);
            }
        }

        area.addEventListener("paste", event => {
            const items = event.clipboardData ? event.clipboardData.items : [];
            for (const item of items) {
                if (item.kind === "file") {
                    const file = item.getAsFile();
                    if (isImageFile(file)) {
                        event.preventDefault();
                        uploadImage(file, getEditableRange());
                        return;
                    }
                }
            }
            const text = event.clipboardData?.getData("text/plain");
            if (text) {
                event.preventDefault();
                insertNodeAtRange(document.createTextNode(text), getEditableRange());
                updateGutters();
                area.dispatchEvent(new Event("input"));
            }
        });

        ["dragenter", "dragover"].forEach(type => {
            area.addEventListener(type, event => {
                if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
                event.preventDefault();
                area.classList.add("drag-over");
            });
        });

        area.addEventListener("dragleave", () => area.classList.remove("drag-over"));

        function rangeFromPoint(x, y) {
            if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
            if (document.caretPositionFromPoint) {
                const pos = document.caretPositionFromPoint(x, y);
                if (!pos) return null;
                const range = document.createRange();
                range.setStart(pos.offsetNode, pos.offset);
                range.collapse(true);
                return range;
            }
            return null;
        }

        area.addEventListener("drop", event => {
            event.preventDefault();
            area.classList.remove("drag-over");
            const files = event.dataTransfer ? Array.from(event.dataTransfer.files) : [];
            const images = files.filter(isImageFile);

            if (images.length) {
                const dropRange = rangeFromPoint(event.clientX, event.clientY) || getEditableRange();
                images.forEach(file => uploadImage(file, dropRange.cloneRange()));
            } else if (files.length) {
                setStatus("Dropped file isn't a recognized image", 2000);
            }
        });

        updateGutters();
    </script>
</body>

</html>
