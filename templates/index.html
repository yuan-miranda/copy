<!doctype html>
<html>

<head>
    <title>ELMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #fff;
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1rem;
        }

        .container {
            position: absolute;
            inset: 0;
            display: flex;
            background: #fff;
        }

        #gutters {
            min-width: 45px;
            padding: 12px 6px;
            background: #fdfdfd;
            border-right: 1px solid #eaeaea;
            color: #aaa;
            text-align: right;
            user-select: none;
            overflow: hidden;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre;
        }

        #paste {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            border: none;
            outline: none;
            background: #fff;
            color: #000;
            padding: 12px;
            padding-bottom: 40px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.5;
        }

        #paste:empty::before {
            content: attr(data-placeholder);
            color: #999;
            pointer-events: none;
        }

        #paste img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            border: 1px solid #ccc;
            vertical-align: middle;
            cursor: default;
        }

        #paste img.img-selected {
            outline: 2px solid #0078d4;
            outline-offset: 1px;
        }

        .resize-handle {
            position: fixed;
            background: #0078d4;
            border: 1px solid #fff;
            box-sizing: border-box;
            z-index: 10;
            touch-action: none;
        }

        .resize-handle.corner {
            width: 12px;
            height: 12px;
            cursor: se-resize;
        }

        .resize-handle.edge-right {
            width: 8px;
            height: 28px;
            border-radius: 2px;
            cursor: e-resize;
        }

        .resize-handle.edge-bottom {
            width: 28px;
            height: 8px;
            border-radius: 2px;
            cursor: s-resize;
        }

        .bar {
            position: fixed;
            right: 12px;
            bottom: 6px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        button {
            padding: 4px 8px;
            border: 1px solid #888;
            background: #f8f8f8;
            color: #000;
            font: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background: #eee;
        }

        #status {
            position: fixed;
            left: 60px;
            bottom: 6px;
            font-size: 0.9rem;
            color: #666;
            z-index: 5;
            pointer-events: none;
        }

        #user-count {
            position: fixed;
            top: 8px;
            right: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            z-index: 5;
            user-select: none;
            pointer-events: none;
        }

        #paste.drag-over {
            background: #f0f4f8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="gutters">1</div>
        <div id="paste" contenteditable="true" spellcheck="false"
            data-placeholder="Paste or type here... (images can be pasted or dropped too)"></div>
    </div>
    <div id="status"></div>
    <div id="user-count">1</div>
    <div class="bar">
        <button onclick="copyText()">Copy</button>
    </div>
    <script>
        const area = document.getElementById("paste");
        const gutters = document.getElementById("gutters");
        const status = document.getElementById("status");
        const userCountEl = document.getElementById("user-count");

        let socket = null;
        let saveTimer = null;
        let savedFadeTimer = null;
        let reconnectTimer = null;
        let pageCaching = false;

        function getLineHeight() {
            return parseFloat(window.getComputedStyle(area).lineHeight) || 24;
        }

        function snapImageToLines(img) {
            const lh = getLineHeight();

            const existingWidth = parseFloat(img.style.width);
            const naturalRatio = img.naturalWidth && img.naturalHeight
                ? img.naturalWidth / img.naturalHeight
                : null;

            // max-width:100% only clamps WIDTH, never height, so on a narrow/mobile
            // viewport an image whose inline width/height were set on a wider screen
            // gets visually squashed inside its own (unchanged) height box instead
            // of reflowing to more lines. Detect that by comparing the box's actual
            // rendered width (post-clamp) against the CSS width we last stored.
            const rect = img.getBoundingClientRect();
            const renderedWidth = rect.width || img.offsetWidth;
            const isClamped = existingWidth > 0 && renderedWidth > 0 && renderedWidth < existingWidth - 0.5;

            // When clamped, derive height from the clamped width + aspect ratio
            // (what the image should actually be), not from the current rendered
            // height, which hasn't moved and no longer matches the clamped width.
            const baseHeight = isClamped && naturalRatio
                ? renderedWidth / naturalRatio
                : (rect.height || img.naturalHeight || img.offsetHeight);

            if (!(baseHeight > 0)) return;

            const targetLines = Math.max(1, Math.round(baseHeight / lh));
            const snappedHeight = targetLines * lh;

            img.style.height = `${snappedHeight}px`;

            if (!(existingWidth > 0)) {
                // Freshly inserted image: derive width from natural ratio.
                if (naturalRatio) {
                    img.style.width = `${Math.round(snappedHeight * naturalRatio)}px`;
                }
            } else if (isClamped) {
                // Bring the stored width down to what's actually rendering, so this
                // stays consistent (and idempotent) next time this runs, and so the
                // stored size round-trips correctly through sanitize/sync.
                img.style.width = `${Math.round(renderedWidth)}px`;
            }
            img.style.objectFit = "contain";
        }

        // Returns the number of visual rows the editor's content actually occupies,
        // by measuring real client rects for every text run and every image instead
        // of estimating from total scrollHeight / lineHeight (which drifts under
        // sub-pixel rounding, wrapped text, and images whose height isn't an exact
        // multiple of the line height - as seen by the mobile vs desktop drift).
        // Returns the last block element (direct child of the editor, or the
        // editor itself for plain text/br content) that contains real content:
        // non-whitespace text or an image. Used to trim trailing blank lines
        // (e.g. leftover empty <div><br></div> rows from editing history) out of
        // the gutter count, so the numbering doesn't run on past what was
        // actually typed.
        function lastContentBlock() {
            const blocks = Array.from(area.childNodes);
            for (let i = blocks.length - 1; i >= 0; i--) {
                const node = blocks[i];
                if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "IMG") return node;
                const hasText = (node.textContent || "").trim().length > 0;
                const hasImg = node.nodeType === Node.ELEMENT_NODE && node.querySelector && node.querySelector("img");
                if (hasText || hasImg) return node;
            }
            return null;
        }

        function countVisualRows() {
            const lh = getLineHeight();
            if (!area.firstChild) return 1;

            // Trailing blank lines (empty <div><br></div> rows left over from
            // editing/sync history) shouldn't extend the gutter past what was
            // actually typed. Find the lowest point worth counting up to: the
            // bottom of the last block with real content, or - if the caret is
            // actively positioned further down, e.g. the user just pressed Enter
            // onto a fresh blank line - the bottom of the caret's own block, so a
            // line you're actively on still shows immediately.
            let cutoffBottom = Infinity;
            const contentBlock = lastContentBlock();
            if (contentBlock) {
                const rect = contentBlock.nodeType === Node.ELEMENT_NODE
                    ? contentBlock.getBoundingClientRect()
                    : null;
                if (rect) cutoffBottom = rect.bottom;
            }
            const selection = window.getSelection();
            if (document.activeElement === area && selection && selection.rangeCount > 0) {
                const caretNode = selection.getRangeAt(0).startContainer;
                if (area.contains(caretNode)) {
                    const caretRange = document.createRange();
                    caretRange.selectNodeContents(caretNode);
                    const rects = caretRange.getClientRects();
                    if (rects.length) {
                        cutoffBottom = Math.max(cutoffBottom, rects[rects.length - 1].bottom);
                    } else {
                        // Empty block (just a <br>): use the block element's own rect.
                        let el = caretNode.nodeType === Node.ELEMENT_NODE ? caretNode : caretNode.parentElement;
                        if (el && area.contains(el)) {
                            cutoffBottom = Math.max(cutoffBottom, el.getBoundingClientRect().bottom);
                        }
                    }
                }
            }
            if (cutoffBottom === Infinity) {
                // No content and nothing focused (e.g. programmatic update while
                // blurred): fall back to the editor's own content height.
                cutoffBottom = area.getBoundingClientRect().top + (area.scrollHeight - 52);
            }

            const rowTops = [];
            const addRect = rect => {
                if (rect.height === 0 && rect.width === 0) return; // collapsed/empty
                if (rect.top > cutoffBottom + 1) return; // past the last real/active line
                // Bucket by top position (rounded) so rects belonging to the same
                // visual row don't get counted twice.
                const top = Math.round(rect.top);
                if (!rowTops.length || Math.abs(top - rowTops[rowTops.length - 1]) > 1) {
                    // Only push if this top hasn't been seen already (handles
                    // interleaved inline nodes on the same row).
                    if (!rowTops.some(t => Math.abs(t - top) <= 1)) rowTops.push(top);
                } else if (!rowTops.includes(top)) {
                    rowTops.push(top);
                }
            };

            const range = document.createRange();
            const walker = document.createTreeWalker(
                area,
                NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
                {
                    acceptNode(node) {
                        if (node.nodeType === Node.TEXT_NODE) return NodeFilter.FILTER_ACCEPT;
                        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "IMG") return NodeFilter.FILTER_ACCEPT;
                        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "BR") return NodeFilter.FILTER_ACCEPT;
                        return NodeFilter.FILTER_SKIP;
                    }
                }
            );

            let node;
            let sawAny = false;
            while ((node = walker.nextNode())) {
                sawAny = true;
                if (node.nodeType === Node.TEXT_NODE) {
                    if (!node.nodeValue || !node.nodeValue.length) continue;
                    range.selectNodeContents(node);
                    const rects = range.getClientRects();
                    for (const rect of rects) addRect(rect);
                } else {
                    // IMG or BR: use its own bounding rect(s) as a row marker.
                    const rects = node.getClientRects ? node.getClientRects() : [node.getBoundingClientRect()];
                    for (const rect of rects) {
                        addRect(rect);
                        // An image is snapped to an exact multiple of the line
                        // height and spans that many rows, but it only produces one
                        // bounding rect - synthesize the remaining row-tops it
                        // occupies so the gutter gets one number per line of image
                        // height, not just one number for the whole image.
                        if (node.tagName === "IMG" && rect.height > lh * 1.5) {
                            const extraRows = Math.round(rect.height / lh) - 1;
                            for (let i = 1; i <= extraRows; i++) {
                                addRect({ top: rect.top + i * lh, height: lh, width: rect.width });
                            }
                        }
                    }
                }
            }

            if (!sawAny) return 1;

            rowTops.sort((a, b) => a - b);
            // Merge tops that are within half a line-height of each other (handles
            // an image and adjacent text baseline sitting on the "same" row).
            const merged = [];
            for (const top of rowTops) {
                if (!merged.length || top - merged[merged.length - 1] > lh * 0.5) {
                    merged.push(top);
                }
            }

            return Math.max(1, merged.length);
        }

        function updateGutters() {
            const lh = getLineHeight();

            // Snap images first (skip whichever image is actively being dragged -
            // its own resize handler already keeps it snapped, and re-snapping here
            // from a ResizeObserver callback while it's mid-drag would fight the drag).
            const images = area.querySelectorAll("img");
            images.forEach(img => {
                if (resizeState && img === selectedImg) return;
                snapImageToLines(img);
            });

            // Count actual rendered rows rather than estimating from height, so the
            // gutter matches real wrap points on any screen size / zoom level.
            const totalLines = countVisualRows();

            let result = "";
            for (let i = 1; i <= totalLines; i++) {
                result += i + "\n";
            }
            gutters.textContent = result;

            // Dynamically resize gutter width based on max digit length
            const maxDigit = String(totalLines).length;
            gutters.style.width = Math.max(45, maxDigit * 10 + 16) + "px";
        }

        area.addEventListener("scroll", () => {
            gutters.scrollTop = area.scrollTop;
        });

        // Catch-all: any layout change to the editor's content box (image resize,
        // font load, window resize, text reflow that doesn't fire "input", etc.)
        // re-syncs the gutter automatically instead of relying on us remembering
        // to call updateGutters() after every possible mutation.
        let guttersRaf = null;
        const guttersObserver = new ResizeObserver(() => {
            if (guttersRaf) return;
            guttersRaf = requestAnimationFrame(() => {
                guttersRaf = null;
                updateGutters();
            });
        });
        guttersObserver.observe(area);

        function setStatus(text) {
            clearTimeout(savedFadeTimer);
            status.textContent = text;
        }

        function sanitizeHtml(html) {
            const template = document.createElement("template");
            template.innerHTML = html;
            sanitizeChildren(template.content);
            return template.innerHTML;
        }

        function sanitizeChildren(node) {
            for (const child of Array.from(node.childNodes)) {
                if (child.nodeType === Node.TEXT_NODE) continue;
                if (child.nodeType !== Node.ELEMENT_NODE) { child.remove(); continue; }

                const tag = child.tagName.toLowerCase();
                if (tag === "img") {
                    const src = child.getAttribute("src") || "";
                    if (!/^\/pastebin-image\//.test(src)) { child.remove(); continue; }
                    const style = child.getAttribute("style") || "";
                    // Parse each declaration separately instead of anchoring the whole
                    // string, since the style attribute holds width, height AND
                    // object-fit together (e.g. "height:60px; width:80px; object-fit: contain;").
                    const widthMatch = /(?:^|;)\s*width:\s*(\d+(?:\.\d+)?)px\s*(?:;|$)/i.exec(style);
                    const heightMatch = /(?:^|;)\s*height:\s*(\d+(?:\.\d+)?)px\s*(?:;|$)/i.exec(style);

                    for (const attr of Array.from(child.attributes)) {
                        if (attr.name !== "src" && attr.name !== "alt") child.removeAttribute(attr.name);
                    }

                    let styleAttr = "";
                    if (widthMatch) styleAttr += `width:${widthMatch[1]}px;`;
                    if (heightMatch) styleAttr += `height:${heightMatch[1]}px;`;
                    styleAttr += `object-fit:contain;`;
                    if (styleAttr) child.setAttribute("style", styleAttr);
                    continue;
                }
                if (tag === "br" || tag === "div") {
                    for (const attr of Array.from(child.attributes)) child.removeAttribute(attr.name);
                    sanitizeChildren(child);
                    continue;
                }
                const text = document.createTextNode(child.textContent);
                child.replaceWith(text);
            }
        }

        function connect() {
            setStatus("Connecting...");
            socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/pastebin-ws");
            socket.onopen = () => setStatus("");
            socket.onmessage = event => {
                const data = JSON.parse(event.data);
                if (data.type === "update" && document.activeElement !== area) {
                    deselectImage();
                    area.innerHTML = sanitizeHtml(data.text || "");
                    updateGutters();
                }
                if (data.type === "saved") {
                    setStatus("Saved");
                    savedFadeTimer = setTimeout(() => { status.textContent = ""; }, 1200);
                }
                if (data.users !== undefined) {
                    userCountEl.textContent = data.users;
                }
            };
            socket.onclose = () => {
                if (pageCaching) return;
                setStatus("Offline, reconnecting...");
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connect, 2000);
            };
            socket.onerror = () => socket.close();
        }
        connect();

        window.addEventListener("pagehide", event => {
            if (!event.persisted) return;
            pageCaching = true;
            clearTimeout(reconnectTimer);
            if (socket) socket.close();
        });

        window.addEventListener("pageshow", event => {
            if (!event.persisted) return;
            pageCaching = false;
            connect();
        });

        area.addEventListener("input", () => {
            updateGutters();
            setStatus("Syncing...");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(sendHtml, 300);
        });

        function sendHtml() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                setStatus("Saving...");
                socket.send(JSON.stringify({ type: "update", text: sanitizeHtml(area.innerHTML) }));
            }
        }

        function copyText() {
            navigator.clipboard.writeText(area.textContent);
            setStatus("Copied to clipboard");
            savedFadeTimer = setTimeout(() => { status.textContent = ""; }, 1200);
        }

        function getEditableRange() {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                if (area.contains(range.commonAncestorContainer)) return range;
            }
            const range = document.createRange();
            range.selectNodeContents(area);
            range.collapse(false);
            return range;
        }

        function insertNodeAtRange(node, range) {
            range.deleteContents();
            range.insertNode(node);
            range.setStartAfter(node);
            range.collapse(true);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function insertTextAtRange(text, range) {
            insertNodeAtRange(document.createTextNode(text), range);
        }

        function insertImageAtRange(url, range) {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "pasted image";
            img.onload = () => {
                snapImageToLines(img);
                updateGutters();
                area.dispatchEvent(new Event("input"));
            };
            insertNodeAtRange(img, range);
        }

        let selectedImg = null;
        let resizeHandles = null; // { corner, right, bottom }
        let resizeState = null;

        function positionHandles() {
            if (!selectedImg || !resizeHandles) return;
            const rect = selectedImg.getBoundingClientRect();
            resizeHandles.corner.style.left = `${rect.right - 6}px`;
            resizeHandles.corner.style.top = `${rect.bottom - 6}px`;

            resizeHandles.right.style.left = `${rect.right - 4}px`;
            resizeHandles.right.style.top = `${rect.top + rect.height / 2 - 14}px`;

            resizeHandles.bottom.style.left = `${rect.left + rect.width / 2 - 14}px`;
            resizeHandles.bottom.style.top = `${rect.bottom - 4}px`;
        }
        // Back-compat alias (referenced elsewhere as positionHandle).
        function positionHandle() { positionHandles(); }

        function makeHandle(className, mode) {
            const handle = document.createElement("div");
            handle.className = `resize-handle ${className}`;
            document.body.appendChild(handle);
            handle.addEventListener("pointerdown", event => startResize(event, mode, handle));
            return handle;
        }

        function selectImage(img) {
            if (selectedImg === img) return;
            deselectImage();
            selectedImg = img;
            selectedImg.classList.add("img-selected");
            resizeHandles = {
                corner: makeHandle("corner", "both"),
                right: makeHandle("edge-right", "width"),
                bottom: makeHandle("edge-bottom", "height")
            };
            positionHandles();
        }

        function deselectImage() {
            if (selectedImg) selectedImg.classList.remove("img-selected");
            if (resizeHandles) {
                resizeHandles.corner.remove();
                resizeHandles.right.remove();
                resizeHandles.bottom.remove();
            }
            selectedImg = null;
            resizeHandles = null;
        }

        function startResize(event, mode, handle) {
            if (!selectedImg) return;
            event.preventDefault();
            event.stopPropagation();
            resizeState = {
                mode, // "width" | "height" | "both"
                startX: event.clientX,
                startY: event.clientY,
                startWidth: selectedImg.getBoundingClientRect().width,
                startHeight: selectedImg.getBoundingClientRect().height,
                aspectRatio: selectedImg.naturalWidth / selectedImg.naturalHeight || 1
            };
            handle.setPointerCapture(event.pointerId);
            handle.addEventListener("pointermove", onResizeMove);
            handle.addEventListener("pointerup", endResize);
        }

        // A "char width" step for width-only resizing, so dragging the right edge
        // snaps to the same monospace grid the gutter/text uses horizontally.
        function getCharWidth() {
            const probe = document.createElement("span");
            probe.textContent = "0";
            probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:inherit;";
            area.appendChild(probe);
            const width = probe.getBoundingClientRect().width || 8;
            probe.remove();
            return width;
        }

        function onResizeMove(event) {
            if (!resizeState || !selectedImg) return;
            const lh = getLineHeight();
            const mode = resizeState.mode;

            let newHeight = resizeState.startHeight;
            let newWidth = resizeState.startWidth;

            if (mode === "height" || mode === "both") {
                const deltaY = event.clientY - resizeState.startY;
                const rawHeight = resizeState.startHeight + deltaY;
                const lineCount = Math.max(1, Math.round(rawHeight / lh));
                newHeight = lineCount * lh;
            }

            if (mode === "width" || mode === "both") {
                const deltaX = event.clientX - resizeState.startX;
                const rawWidth = resizeState.startWidth + deltaX;
                if (mode === "width") {
                    // Free-ish width-only resize, snapped to a character-width grid
                    // so it stays visually aligned with the monospace text grid.
                    const cw = getCharWidth();
                    const charCount = Math.max(1, Math.round(rawWidth / cw));
                    newWidth = charCount * cw;
                } else {
                    newWidth = Math.round(newHeight * resizeState.aspectRatio);
                }
            }

            if (mode === "both") {
                newWidth = Math.round(newHeight * resizeState.aspectRatio);
            }

            selectedImg.style.height = `${Math.max(lh, newHeight)}px`;
            selectedImg.style.width = `${Math.max(4, newWidth)}px`;
            selectedImg.style.objectFit = "contain";

            positionHandles();
            updateGutters();
        }

        function endResize(event) {
            const handle = event.currentTarget;
            handle.releasePointerCapture(event.pointerId);
            handle.removeEventListener("pointermove", onResizeMove);
            handle.removeEventListener("pointerup", endResize);
            resizeState = null;
            updateGutters();
            area.dispatchEvent(new Event("input"));
        }

        area.addEventListener("click", event => {
            if (event.target.tagName === "IMG" && area.contains(event.target)) {
                selectImage(event.target);
            } else {
                deselectImage();
            }
        });

        document.addEventListener("click", event => {
            if (resizeHandles && (
                event.target === resizeHandles.corner ||
                event.target === resizeHandles.right ||
                event.target === resizeHandles.bottom
            )) return;
            if (!area.contains(event.target)) deselectImage();
        });

        area.addEventListener("scroll", () => {
            positionHandle();
            gutters.scrollTop = area.scrollTop;
        });
        window.addEventListener("resize", positionHandle);

        const IMAGE_EXTENSION_RE = /\.(png|jpe?g|gif|webp|bmp|avif|svg|heic|heif)$/i;

        function isImageFile(file) {
            if (!file) return false;
            if (file.type && file.type.startsWith("image/")) return true;
            return IMAGE_EXTENSION_RE.test(file.name || "");
        }

        async function uploadImage(file, range) {
            setStatus("Uploading image...");
            const formData = new FormData();
            formData.append("image", file, file.name || "pasted-image.png");
            try {
                const response = await fetch("/pastebin-image", { method: "POST", body: formData });
                if (!response.ok) throw new Error("Upload failed");
                const data = await response.json();
                insertImageAtRange(data.url, range);
                setStatus("");
            } catch (error) {
                setStatus("Image upload failed");
                savedFadeTimer = setTimeout(() => { status.textContent = ""; }, 2000);
            }
        }

        area.addEventListener("paste", event => {
            const items = event.clipboardData ? event.clipboardData.items : [];
            for (const item of items) {
                if (item.kind === "file") {
                    const file = item.getAsFile();
                    if (isImageFile(file)) {
                        event.preventDefault();
                        uploadImage(file, getEditableRange());
                        return;
                    }
                }
            }
            const text = event.clipboardData ? event.clipboardData.getData("text/plain") : "";
            if (text) {
                event.preventDefault();
                insertTextAtRange(text, getEditableRange());
                updateGutters();
                area.dispatchEvent(new Event("input"));
            }
        });

        area.addEventListener("dragenter", event => {
            if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
            event.preventDefault();
            area.classList.add("drag-over");
        });

        area.addEventListener("dragover", event => {
            if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
            event.preventDefault();
            area.classList.add("drag-over");
        });

        area.addEventListener("dragleave", () => {
            area.classList.remove("drag-over");
        });

        function rangeFromPoint(x, y) {
            if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
            if (document.caretPositionFromPoint) {
                const pos = document.caretPositionFromPoint(x, y);
                if (!pos) return null;
                const range = document.createRange();
                range.setStart(pos.offsetNode, pos.offset);
                range.collapse(true);
                return range;
            }
            return null;
        }

        area.addEventListener("drop", event => {
            event.preventDefault();
            area.classList.remove("drag-over");
            const files = event.dataTransfer ? Array.from(event.dataTransfer.files) : [];
            const images = files.filter(isImageFile);
            if (images.length) {
                const dropRange = rangeFromPoint(event.clientX, event.clientY) || getEditableRange();
                images.forEach(file => uploadImage(file, dropRange.cloneRange()));
            } else if (files.length) {
                setStatus("Dropped file isn't a recognized image");
                savedFadeTimer = setTimeout(() => { status.textContent = ""; }, 2000);
            }
        });

        updateGutters();
    </script>
</body>

</html>
